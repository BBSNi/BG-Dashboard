<header class="kopf">
  <div class="kopf-innen">
    <a class="marke" href="#start">
      <img class="marke-zeichen" src="icons/logo-bbs.png" alt="Logo der BBS Nienburg" width="55" height="36">
      <span class="marke-text"><b>BG Nienburg</b><span>Berufliches Gymnasium</span></span>
    </a>
    <nav class="nav-oben" aria-label="Hauptbereiche">
      <a href="#start" data-bereich="start">Start</a>
      <a href="#klasse" data-bereich="klasse" hidden>Meine Klasse</a>
      <a href="#alle" data-bereich="alle">Alle Seiten</a>
      <a href="#coolflex" data-bereich="lehrkraefte" hidden>Lehrkräfte</a>
    </nav>
  </div>
</header>

<main id="inhalt">
  <div id="meldungen" class="ansicht" style="gap:10px"></div>
  <section class="ansicht" id="ansicht" aria-live="polite"></section>
</main>

<nav class="nav-unten" aria-label="Hauptbereiche">
  <a href="#start" data-bereich="start"><svg><use href="#i-start"/></svg>Start</a>
  <a href="#klasse" data-bereich="klasse" hidden><svg><use href="#i-klasse"/></svg>Meine Klasse</a>
  <a href="#alle" data-bereich="alle"><svg><use href="#i-alle"/></svg>Alle Seiten</a>
  <a href="#coolflex" data-bereich="lehrkraefte" hidden><svg><use href="#i-lehrkraft"/></svg>Lehrkräfte</a>
</nav>

<!-- Formular: Auftrag eintragen / bearbeiten -->
<dialog id="dlg-auftrag">
  <form class="dlg" id="form-auftrag" method="dialog" novalidate>
    <div class="karte-kopf">
      <h2 id="dlg-titel">Auftrag eintragen</h2>
      <button type="button" class="symbolknopf" data-schliessen aria-label="Schließen">✕</button>
    </div>
    <div class="formular">
      <fieldset class="ganz"><legend>Klassen</legend><div class="wahl" id="a-klassen"></div></fieldset>
      <label class="feld">Fach<select id="a-fach"></select></label>
      <label class="feld">Lehrkraft <span class="tipp">Kürzel, freiwillig</span><input type="text" id="a-lehrkraft" maxlength="8" autocomplete="off"></label>
      <label class="feld ganz">Titel des Auftrags<input type="text" id="a-titel" maxlength="90" autocomplete="off" placeholder="Erörterung: Social Media in der Schule"></label>
      <label class="feld">Start<input type="date" id="a-start"></label>
      <label class="feld">Ende (Abgabe)<input type="date" id="a-ende"></label>
      <label class="feld">Umfang in COOL-Stunden <span class="tipp">geschätzt, gesamt</span><input type="number" id="a-umfang" min="0.5" max="60" step="0.5"></label>
      <fieldset><legend>Sozialform</legend><div class="wahl" id="a-soz"></div></fieldset>
      <label class="feld ganz">Notiz <span class="tipp">freiwillig, z. B. Moodle-Kurs</span><input type="text" id="a-notiz" maxlength="140" autocomplete="off"></label>
    </div>
    <div class="vorschau" id="a-vorschau"></div>
    <div class="fuss">
      <button type="button" class="knopf gefahr" id="a-loeschen" hidden>Löschen</button>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto">
        <span class="fehler" id="a-fehler" role="alert"></span>
        <button type="button" class="knopf" data-schliessen>Abbrechen</button>
        <button type="submit" class="knopf haupt" id="a-speichern">Speichern</button>
      </div>
    </div>
  </form>
</dialog>

<script src="js/config.js"></script>
<script src="js/kern.js"></script>
<script src="js/daten.js"></script>
<script src="js/ansichten.js"></script>
<script src="js/lehrkraefte.js"></script>
<script src="js/app.js"></script>
</body>
</html>
